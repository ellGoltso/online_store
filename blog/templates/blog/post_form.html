<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <h1>Создание статьи</h1>
    <div class="container mt-5">
        <h1 class="mb-4">Форма Post</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a href="{% url 'blog:post_list' %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</body>
</html>
