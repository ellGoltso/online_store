{% extends 'base.html' %}

{% block content %}
<h1>Создание продукта</h1>
<div class="container mt-5">
    <h1 class="mb-4">Форма Product</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{% url 'catalog:product_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
